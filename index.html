    <script>
        const API_URL = "http://localhost:8000"; // Upewnij się, że Twój serwer FastAPI działa pod tym adresem

        async function generateSprite() {
            const imageFile = document.getElementById('imageUpload').files[0];
            const prompt = document.getElementById('promptInput').value;
            const animations = document.getElementById('animationsSelect').value;
            const frameSize = document.getElementById('frameSizeInput').value;

            // Elementy UI
            const spinner = document.getElementById('loadingSpinner');
            const error = document.getElementById('errorMessage');
            const outputSection = document.getElementById('outputSection');

            // Reset stanu
            error.style.display = 'none';
            spinner.style.display = 'block';
            outputSection.style.display = 'none';

            // Przygotowanie danych do wysyłki
            const formData = new FormData();
            formData.append('prompt', prompt);
            formData.append('animations', animations);
            formData.append('frame_size', frameSize);
            if (imageFile) {
                formData.append('image', imageFile);
            }

            try {
                const response = await fetch(`${API_URL}/generate-sprite`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('Błąd serwera: ' + response.statusText);

                const data = await response.json();

                // Wyświetlanie wyników (zakładając, że API zwraca URL do plików)
                document.getElementById('spriteSheetOutput').src = data.sprite_sheet_url;
                document.getElementById('spriteSheetOutput').style.display = 'block';
                document.getElementById('spriteSheetPlaceholder').style.display = 'none';

                document.getElementById('previewGifOutput').src = data.gif_url;
                document.getElementById('previewGifOutput').style.display = 'block';
                document.getElementById('previewGifPlaceholder').style.display = 'none';

                outputSection.style.display = 'block';
            } catch (err) {
                error.innerText = "Wystąpił błąd: " + err.message;
                error.style.display = 'block';
            } finally {
                spinner.style.display = 'none';
            }
        }

        function resetForm() {
            document.getElementById('imageUpload').value = '';
            document.getElementById('promptInput').value = 'pixel art warrior, fantasy, knight, sword, shield';
            document.getElementById('outputSection').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'none';
        }
    </script>
